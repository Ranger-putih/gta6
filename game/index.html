<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Rush — Sunset Bay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1210;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #hud-top-left {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(12, 12, 18, 0.62);
    border-radius: 10px;
    padding: 10px 14px;
  }
  #hud-money {
    font-size: 26px;
    font-weight: 800;
    color: #7ee787;
    letter-spacing: 0.5px;
  }
  #hud-health {
    width: 150px;
    height: 8px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  #hud-health-fill {
    height: 100%;
    width: 100%;
    background: #58c96b;
    border-radius: 4px;
  }
  #hud-top-right {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(12, 12, 18, 0.62);
    border-radius: 10px;
    padding: 10px 14px;
  }
  #hud-stars {
    font-size: 26px;
    letter-spacing: 4px;
    color: rgba(255, 255, 255, 0.35);
  }
  #hud-objective {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    max-width: 640px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    background: rgba(12, 12, 18, 0.62);
    border-radius: 10px;
    padding: 10px 18px;
  }
  #hud-speed {
    position: absolute;
    right: 20px;
    bottom: 20px;
    font-size: 30px;
    font-weight: 800;
    background: rgba(12, 12, 18, 0.62);
    border-radius: 10px;
    padding: 8px 14px;
  }
  #hud-speed span {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.75);
  }
  #hud-minimap {
    position: absolute;
    left: 16px;
    bottom: 16px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 10px;
    background: rgba(12, 12, 18, 0.8);
  }
  #hud-messages {
    position: absolute;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .hud-toast {
    background: rgba(20, 16, 8, 0.82);
    border: 1px solid rgba(255, 217, 77, 0.55);
    color: #ffd94d;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    padding: 8px 14px;
  }
  #hud-screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 8, 14, 0.55);
    pointer-events: auto;
  }
  #hud-screen.hidden {
    display: none;
  }
  .screen-card {
    max-width: 560px;
    margin: 0 20px;
    text-align: center;
    background: rgba(16, 12, 20, 0.88);
    border: 1px solid rgba(255, 179, 107, 0.45);
    border-radius: 16px;
    padding: 34px 40px;
  }
  .screen-card h1 {
    margin: 0 0 4px;
    font-size: 52px;
    letter-spacing: 6px;
    color: #ffb36b;
  }
  .screen-sub {
    margin: 0 0 18px;
    font-size: 17px;
    color: #ffd9a0;
    font-weight: 600;
  }
  .screen-card p {
    font-size: 16px;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.88);
  }
  .screen-keys {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.65);
  }
  .screen-hint {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
  }
  .screen-card button {
    pointer-events: auto;
    cursor: pointer;
    margin-top: 14px;
    padding: 14px 34px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1a1210;
    background: #ffb36b;
    border: none;
    border-radius: 10px;
  }
  .screen-card button:hover {
    background: #ffc98f;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
